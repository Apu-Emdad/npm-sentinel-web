name: npm-sentinel-web

services:
  web:
    build:
      context: .
      target: runtime
      args:
        # Baked into the build: the address the browser uses to reach the API
        VITE_API_URL: ${VITE_API_URL:-http://localhost:6001}
    image: npm-sentinel-web
    container_name: npm-sentinel-web
    restart: unless-stopped
    # 5173 matches WEB_ORIGIN in the API's .env, which CORS and the refresh cookie need
    ports:
      - '5173:4173'
